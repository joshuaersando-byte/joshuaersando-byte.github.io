<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173f46" />
  <meta name="description" content="RPM 2027 Review Hub — a six-month Psychometrician Licensure Examination review companion based on the 2026 subject framework and PRC enhanced TOS." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>RPM 2027 Review Hub</title>
  <style>
    :root{color-scheme:light dark}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f3ee;color:#202a2e}
    #boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;background:#f5f3ee}
    #boot .box{max-width:460px}
    #boot b{font-size:26px;letter-spacing:-.02em}
    #boot small{display:block;margin-top:10px;color:#647587;line-height:1.55}
    #boot .bar{height:5px;width:220px;max-width:70vw;background:#dedbd2;border-radius:999px;margin:22px auto 0;overflow:hidden}
    #boot .bar:after{content:"";display:block;height:100%;width:40%;background:#173f46;border-radius:999px;animation:load 1s ease-in-out infinite alternate}
    @keyframes load{from{transform:translateX(-20%)}to{transform:translateX(170%)}}
  </style>
</head>
<body>
  <div id="boot">
    <div class="box">
      <b>RPM 2027 Review Hub</b>
      <small>Loading your six-month Psychometrician board review workspace…</small>
      <div class="bar"></div>
    </div>
  </div>
  <div id="app"></div>

  <script>
  (async()=>{
    const dataFiles=[1,2,3,4,5,6,7].map(n=>`payload/data-${String(n).padStart(2,'0')}.b64`);
    const appFiles=[1,2,3,4].map(n=>`payload/app-${String(n).padStart(2,'0')}.b64`);
    const cssFiles=[1,2].map(n=>`payload/css-${String(n).padStart(2,'0')}.b64`);

    function fromB64(s){
      const b=atob(s.trim());
      return Uint8Array.from(b,c=>c.charCodeAt(0));
    }

    async function unpack(files){
      const parts=await Promise.all(files.map(async file=>{
        const res=await fetch(file,{cache:'no-cache'});
        if(!res.ok) throw new Error(`Failed to load ${file}: ${res.status}`);
        return fromB64(await res.text());
      }));
      const size=parts.reduce((n,p)=>n+p.length,0);
      const bytes=new Uint8Array(size);
      let offset=0;
      for(const p of parts){bytes.set(p,offset);offset+=p.length}
      if(!('DecompressionStream' in window)) throw new Error('This browser does not support the required gzip decompression API.');
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    }

    try{
      const [data,app,css]=await Promise.all([
        unpack(dataFiles),
        unpack(appFiles),
        unpack(cssFiles)
      ]);
      const style=document.createElement('style');
      style.textContent=css;
      document.head.appendChild(style);
      document.getElementById('boot')?.remove();
      (0,eval)(data+'\n'+app);
      if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }catch(err){
      console.error(err);
      const boot=document.getElementById('boot');
      if(boot) boot.innerHTML='<div class="box"><b>Unable to load the review app.</b><small>Refresh the page. If the problem continues, clear this site\'s cached data and reopen it.</small></div>';
    }
  })();
  </script>
</body>
</html>
