<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVR Test</title><style>body{margin:0;font-family:system-ui;background:#f4f7fb;color:#111827}.app{max-width:480px;margin:auto;padding:24px}.screen{display:none}.screen.active{display:block}button{width:100%;min-height:56px;margin:8px 0;border:0;border-radius:16px;font-weight:800;font-size:16px}.dark{background:#0a1734;color:#fff}.blue{background:#275df5;color:#fff}.green{background:#12a06a;color:#fff}.card{background:#fff;border:1px solid #e5eaf1;border-radius:22px;padding:18px;margin-top:12px}</style></head><body><div class="app"><section id="welcome" class="screen active"><h1>DRIVR browser test</h1><p>If these buttons work, GitHub Pages and browser JavaScript are working.</p><button class="dark" data-role="driver">Driver</button><button class="green" data-role="operator">Operator</button><button class="blue" data-role="customer">Customer</button></section><section id="driver" class="screen"><h1>Driver demo works</h1><div class="card">Find work → Accept offer → Start shift → Get paid</div><button class="blue" data-go="welcome">Back</button></section><section id="operator" class="screen"><h1>Operator demo works</h1><div class="card">Find driver → Send offer → Assign vehicle</div><button class="blue" data-go="welcome">Back</button></section><section id="customer" class="screen"><h1>Customer demo works</h1><div class="card">Choose destination → Pick ride → Book</div><button class="blue" data-go="welcome">Back</button></section></div><script>function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}document.addEventListener('click',e=>{const r=e.target.closest('[data-role]');if(r){show(r.dataset.role);return}const g=e.target.closest('[data-go]');if(g)show(g.dataset.go)});</script></body></html>
